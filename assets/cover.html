<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:900px;height:500px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  position:relative;overflow:hidden
}
.shine{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,0.15),transparent 70%);top:-100px;right:-100px;border-radius:50%}
.shine2{position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(6,182,212,0.1),transparent 70%);bottom:-50px;left:-50px;border-radius:50%}
.content{text-align:center;z-index:1;padding:40px}
h1{
  font-size:56px;font-weight:800;
  background:linear-gradient(135deg,#818cf8 0%,#06b6d4 50%,#a78bfa 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:16px;letter-spacing:2px
}
.sub{
  font-size:22px;color:rgba(255,255,255,0.7);
  margin-bottom:8px;letter-spacing:4px
}
.url{
  font-size:28px;color:rgba(255,255,255,0.9);
  background:rgba(255,255,255,0.08);
  display:inline-block;padding:12px 32px;
  border-radius:12px;border:1px solid rgba(255,255,255,0.1);
  margin-top:16px;letter-spacing:1px;
  font-family:'SF Mono','Courier New',monospace
}
.tags{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.tag{
  padding:6px 18px;border-radius:20px;font-size:14px;
  background:rgba(99,102,241,0.2);color:#a5b4fc;border:1px solid rgba(99,102,241,0.3)
}
.badge{
  display:inline-block;padding:4px 14px;border-radius:20px;
  font-size:13px;background:rgba(6,182,212,0.2);color:#67e8f9;
  border:1px solid rgba(6,182,212,0.3);margin-bottom:20px
}
</style>
</head>
<body>
<div class="shine"></div>
<div class="shine2"></div>
<div class="content">
  <div class="badge">🆓 永久免费 · 55+ AI 工具</div>
  <h1>AI 百宝箱</h1>
  <div class="sub">运营 · 开发 · 设计 · 学生</div>
  <div class="url">aiager.top</div>
  <div class="tags">
    <span class="tag">✍️ 写作</span>
    <span class="tag">🎬 视频</span>
    <span class="tag">🎨 图像</span>
    <span class="tag">💻 编程</span>
    <span class="tag">🤖 Agent</span>
    <span class="tag">🎵 音频</span>
    <span class="tag">📊 效率</span>
  </div>
</div>
</body>
</html>
