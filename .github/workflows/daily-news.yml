name: Daily News Fetch

on:
  schedule:
    # 每天北京时间 7:00 (UTC 23:00) 抓取新闻
    - cron: '0 23 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch AI news
        run: |
          echo "=== Starting fetch at $(date -u) ==="
          node scripts/fetch-news.js
          echo "=== Fetch done ==="
          echo "Current news.json entry count:"
          node -e "const d=require('./data/news.json'); console.log(d.length + ' entries, latest: ' + d[0].title)"

      - name: Fetch trending AI projects
        run: |
          node scripts/fetch-projects.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/projects.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "news: daily fetch $(date -u +%Y-%m-%d)"
            git push origin master
            echo "Pushed successfully"
          fi
