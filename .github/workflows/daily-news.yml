name: Daily News Update
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.js
      - name: Commit news update
        run: |
          git config user.name "news-bot"
          git config user.email "bot@aiager.top"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news changes"
          else
            git commit -m "auto: update AI news $(date +%Y-%m-%d)"
            git push
          fi
