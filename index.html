<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI 百宝箱 | 精选AI工具导航</title>
  <style>body{background:#0a0e17}</style>
  <meta name="description" content="精选AI工具，提升工作效率 — 写作/编程/设计/视频全收录"/>
  <meta name="keywords" content="AI工具,人工智能,效率工具,写作,编程,设计"/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://aiager.top/"/>

  <!-- Open Graph -->
  <meta property="og:title" content="AI 百宝箱"/>
  <meta property="og:description" content="精选AI工具，提升工作效率 — 写作/编程/设计/视频全收录"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://aiager.top/"/>
  <meta property="og:image" content="https://aiager.top/assets/icons/logo.svg"/>

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="AI 百宝箱"/>
  <meta name="twitter:description" content="精选AI工具，提升工作效率 — 写作/编程/设计/视频全收录"/>

  <link rel="stylesheet" href="css/style.css"/>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="assets/icons/logo.svg"/>

  <!-- Preconnect to CDN -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net"/>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5148253505955374"
     crossorigin="anonymous"></script>
</head>
<body>
  <!-- Loading indicator -->
  <div id="loader" class="loader" aria-hidden="true">
    <div class="spinner"></div>
  </div>

  <!-- Dynamic particle background -->
  <div id="particles" aria-hidden="true"></div>

  <!-- Top navigation -->
  <header class="glass-nav" role="banner">
    <div class="logo" role="button" tabindex="0" onclick="resetAll()" onkeydown="if(event.key==='Enter')resetAll()">
      <img src="assets/icons/logo.svg" alt="AI Hub Pro" width="32" height="32"/>
      <span>AI 百宝箱</span>
    </div>

    <!-- Smart search -->
    <div class="search-box" role="search">
      <input type="text" id="searchInput" placeholder="搜索工具 / 场景 / 标签..." autocomplete="off" aria-label="搜索工具"/>
      <div class="search-hints" id="searchHints" role="listbox"></div>
    </div>

    <!-- Role switcher -->
    <div class="user-role">
      <select id="roleSelect" aria-label="用户角色筛选">
        <option value="all">🌐 全部角色</option>
        <option value="operator">✍️ 公众号运营</option>
        <option value="developer">💻 技术开发者</option>
        <option value="designer">🎨 创意设计师</option>
        <option value="student">🎓 学习研究者</option>
      </select>
    </div>

    <!-- Auth -->
    <div class="auth-bar">
      <button class="auth-btn" id="loginBtn" onclick="openAuthModal('login')">登录</button>
      <div class="user-menu" id="userMenu" style="display:none">
        <span class="user-name" id="userName"></span>
        <button class="auth-btn auth-outline" onclick="signOut()">退出</button>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main role="main">
    <!-- Scene quick access -->
    <section class="scenes" aria-label="热门场景">
      <h3>🎯 热门场景</h3>
      <div class="scene-tags" id="sceneTags"></div>
      <a href="https://thbe.pages.dev" target="_blank" class="launch-btn">🔧 工具台</a>
      <a href="https://memohmt4.tail369da7.ts.net/" target="_blank" class="launch-btn">💬 OpenCode</a>
    </section>

    <!-- Category navigation -->
    <nav class="categories" aria-label="工具分类">
      <button class="cat-btn active" data-cat="all">全部</button>
      <button class="cat-btn" data-cat="writing">✍️ 写作</button>
      <button class="cat-btn" data-cat="video">🎬 视频</button>
      <button class="cat-btn" data-cat="image">🎨 图像</button>
      <button class="cat-btn" data-cat="code">💻 编程</button>
      <button class="cat-btn" data-cat="agent">🤖 智能体</button>
      <button class="cat-btn" data-cat="audio">🎵 音频</button>
      <button class="cat-btn" data-cat="productivity">⚡ 效率</button>
      <button class="cat-btn" data-cat="news">📰 AI 资讯</button>
    </nav>

    <!-- In-content ad slot -->
    <div class="ad-container ad-incontent" id="adInContent" aria-hidden="true" style="display:none"></div>

    <!-- Tool cards grid -->
    <section class="tools-grid" id="toolsGrid" aria-label="工具列表"></section>

    <!-- Banner ad slot -->
    <div class="ad-container ad-banner" id="adBanner" aria-hidden="true" style="display:none"></div>

    <!-- Deep relation panel -->
    <section class="relations-panel" id="relationsPanel" hidden aria-label="深度关联推荐">
      <div class="relations-header">
        <h3>🔗 深度关联推荐</h3>
        <button class="relations-close" onclick="closeRelations()" aria-label="关闭">✕</button>
      </div>
      <div class="relation-chain" id="relationChain"></div>
    </section>
  </main>

  <!-- Floating WeChat widget -->
  <div class="wechat-float" id="wechatFloat" role="button" tabindex="0" aria-label="公众号联动">
    <div class="wechat-icon">💬</div>
    <div class="wechat-tip">公众号回复【工具名】获取专属教程</div>
    <div class="wechat-qrcode" id="wechatQR">
      <img src="assets/images/wechat-qr.png" alt="公众号二维码" loading="lazy" onerror="this.closest('.wechat-qrcode')?.remove()"/>
    </div>
  </div>

  <!-- Scroll to top -->
  <button class="scroll-top" id="scrollTop" aria-label="返回顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <!-- Submit tool modal -->
  <div class="modal-overlay" id="submitModal" hidden>
    <div class="modal" role="dialog" aria-label="提交工具">
      <div class="modal-header">
        <h3>📦 提交工具</h3>
        <button class="modal-close" onclick="closeSubmitModal()" aria-label="关闭">✕</button>
      </div>
      <form id="submitForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="toolName">工具名称 *</label>
          <input type="text" id="toolName" required placeholder="例如：ChatGPT"/>
        </div>
        <div class="form-group">
          <label for="toolDesc">一句话简介 *</label>
          <input type="text" id="toolDesc" required placeholder="用一句话描述这个工具"/>
        </div>
        <div class="form-group">
          <label for="toolUrl">工具链接 *</label>
          <input type="url" id="toolUrl" required placeholder="https://"/>
        </div>
        <div class="form-group">
          <label for="toolCategory">分类</label>
          <select id="toolCategory">
            <option value="writing">✍️ 写作</option>
            <option value="video">🎬 视频</option>
            <option value="image">🎨 图像</option>
            <option value="code">💻 编程</option>
            <option value="agent">🤖 智能体</option>
            <option value="audio">🎵 音频</option>
            <option value="productivity">⚡ 效率</option>
          </select>
        </div>
        <div class="form-group">
          <label for="toolTags">标签（逗号分隔）</label>
          <input type="text" id="toolTags" placeholder="免费, 国产, 效率"/>
        </div>
        <button type="submit" class="submit-btn">提交</button>
        <p class="form-note">提交后我会审核并添加到列表中 🚀</p>
      </form>
    </div>
  </div>

  <!-- Background Audio -->
  <audio id="bgAudio" preload="none"></audio>

  <!-- Article Reader Modal -->
  <div class="modal-overlay" id="articleOverlay" hidden>
    <div class="modal modal-article" role="dialog" aria-label="文章阅读">
      <div class="modal-header">
        <h3 id="articleTitle">加载中...</h3>
        <button class="modal-close" onclick="closeArticle()" aria-label="关闭">✕</button>
      </div>
      <div class="article-body">
        <div id="articleLoading" class="article-loading">📡 加载中...</div>
        <div id="articleContent" class="article-content"></div>
      </div>
    </div>
  </div>

  <!-- Background Music -->
  <button class="music-toggle" id="musicToggle" aria-label="背景音乐" onclick="toggleMusic()">🎵</button>

  <!-- Footer -->
  <footer role="contentinfo">
    <p>© 2026 AI 百宝箱 · 为创作者赋能 · <a href="#" id="submitToolBtn">提交工具</a> · <a href="privacy.html" target="_blank">隐私政策</a></p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js" crossorigin="anonymous"></script>
  <script src="js/auth-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/wechat.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js" defer></script>
  <script>
    document.getElementById('loader').style.display = 'none';
  </script>
</body>
</html>
